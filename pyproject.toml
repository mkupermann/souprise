[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "souprise"
version = "0.1.0"
description = "Offline RAG for business data: HDC retrieval + LLM generation"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10,<3.13"
authors = [
    { name = "Michael Kupermann", email = "michael@kupermann.com" }
]
keywords = ["rag", "retrieval", "llm", "business", "hdc", "offline", "privacy"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Office/Business",
    "Topic :: Text Processing :: Linguistic",
]

dependencies = [
    "soup-cli[mlx]>=0.73.1",
    "numpy>=1.26.0",
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "huggingface-hub>=0.16.0",
]

[project.optional-dependencies]
# For full HDC functionality (JuiceHDC)
retrieval = [
    "git+https://github.com/mkupermann/JuiceHDC.git@main#egg=cortex-hdc",
]
# For database connectors
postgres = ["psycopg2-binary>=2.9.9", "sqlalchemy>=2.0.0"]
# For development
dev = [
    "souprise[retrieval,postgres]",
    "pytest>=7.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
    "pytest-cov>=4.0",
]

[project.scripts]
souprise = "souprise.cli:app"

[project.urls]
Homepage = "https://github.com/mkupermann/souprise"
Documentation = "https://github.com/mkupermann/souprise#readme"
Repository = "https://github.com/mkupermann/souprise"
Issues = "https://github.com/mkupermann/souprise/issues"

[tool.hatch.build.targets.wheel]
packages = ["souprise"]

[tool.ruff]
target-version = "py310"
line-length = 100
select = ["E", "F", "I", "N", "W"]

[tool.mypy]
python_version = "3.10"
files = ["souprise"]
ignore_missing_imports = true
follow_imports = "silent"
