[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "souprise"
version = "0.1.0"
description = "Offline RAG for business data: HDC retrieval + LLM generation"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    { name = "Michael Kupermann", email = "michael@kupermann.com" }
]
keywords = ["rag", "retrieval", "llm", "business", "hdc", "offline", "privacy"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Office/Business",
    "Topic :: Text Processing :: Linguistic",
]

# Core is intentionally lean: retrieval (built-in HDC), data generators,
# and the CLI work with these three packages alone. Inference backends and
# the optional JuiceHDC engine are installed via extras.
dependencies = [
    "numpy>=1.26.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
# Apple Silicon inference backend
mlx = ["mlx>=0.10.0", "mlx-lm>=0.10.0"]
# CUDA/CPU inference backend
torch = ["torch>=2.0.0", "transformers>=4.40.0"]
# Fine-tuning via Soup; add soup-cli[mlx] (Apple Silicon) or
# soup-cli[train] (CUDA/CPU) for the matching training backend
finetune = ["soup-cli>=0.73.1"]
# Optional JuiceHDC retrieval engine (built-in retriever needs no extra install)
juicehdc = [
    "cortex-hdc @ git+https://github.com/mkupermann/JuiceHDC.git@main",
]
# Planned REST API mode (v0.2)
api = ["fastapi>=0.104.0", "uvicorn>=0.24.0", "pydantic>=2.0.0"]
# Planned database connectors (v0.2)
postgres = ["psycopg2-binary>=2.9.9", "sqlalchemy>=2.0.0"]
# Development: tests and linting run against core only, no git dependencies
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
]

[project.scripts]
souprise = "souprise.cli:app"

[project.urls]
Homepage = "https://github.com/mkupermann/souprise"
Documentation = "https://github.com/mkupermann/souprise#readme"
Repository = "https://github.com/mkupermann/souprise"
Issues = "https://github.com/mkupermann/souprise/issues"

[tool.hatch.build.targets.wheel]
packages = ["souprise"]

[tool.hatch.metadata]
# The juicehdc extra points at a git repository (JuiceHDC has no PyPI release)
allow-direct-references = true

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.mypy]
python_version = "3.10"
files = ["souprise"]
ignore_missing_imports = true
follow_imports = "silent"
