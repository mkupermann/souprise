# Soup configuration for Souprise business LLM fine-tuning
# Generated by: souprise train create-config

base: mlx-community/Phi-2-4bit
task: sft
backend: mlx

data:
  train: data/samples/business_training.jsonl
  format: alpaca
  val_split: 0.1

training:
  epochs: 3
  lr: 2e-5
  batch_size: 4
  optimizer: adamw
  lora:
    r: 16
    alpha: 32
    dropout: 0.05
    target_modules: auto
  quantization: 4bit

output: ./souprise_model
