name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check souprise/ tests/
      - name: Test
        run: pytest tests/ -q --cov=souprise --cov-report=term-missing

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: souprise
          POSTGRES_PASSWORD: souprise
          POSTGRES_DB: souprise_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U souprise"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SOUPRISE_TEST_PG_DSN: postgresql://souprise:souprise@localhost:5432/souprise_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev,postgres]"
      - name: Test connector
        run: pytest tests/test_persistence_importers.py -q
