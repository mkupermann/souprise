<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-label="Souprise architecture: data layer, pluggable retrieval, RAG pipeline, pluggable generation">
  <title>Souprise architecture</title>
  <desc>Four bands: data sources, pluggable HDC retrieval, the SoupriseRAG pipeline, and pluggable local generation backends.</desc>
  <defs>
    <style>
      .title   { font: 700 20px 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif; fill: #EAF1FA; }
      .subtitle{ font: 400 12.5px 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif; fill: #9FB0C7; }
      .band    { font: 700 12px 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif; letter-spacing: 1.6px; fill: #7E8FA8; }
      .cardh   { font: 600 13px 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif; fill: #EAF1FA; }
      .cardv   { font: 400 11px 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif; fill: #9FB0C7; }
      .cardp   { font: 400 10px ui-monospace, 'SF Mono', Menlo, Consolas, monospace; fill: #64748B; }
      .flow    { font: 500 10.5px 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif; fill: #8FB8F2; }
      .badge   { font: 600 9.5px 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif; fill: #8FB8F2; letter-spacing: 0.4px; }
    </style>
    <linearGradient id="archBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D1524"/>
      <stop offset="1" stop-color="#101B30"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5CA8FF" fill-opacity="0.8"/>
    </marker>
  </defs>

  <rect width="1200" height="620" rx="12" fill="url(#archBg)"/>
  <rect x="0.5" y="0.5" width="1199" height="619" rx="12" fill="none" stroke="#24344E"/>

  <text x="48" y="52" class="title">Architecture</text>
  <text x="48" y="74" class="subtitle">Every stage runs locally. Retrieval and generation are pluggable behind BaseRetriever / BaseGenerator interfaces.</text>

  <!-- BAND 1: DATA -->
  <text x="48" y="116" class="band">DATA</text>
  <rect x="48" y="128" width="530" height="88" rx="10" fill="#111D33" stroke="#24344E"/>
  <text x="68" y="154" class="cardh">Synthetic business generators</text>
  <text x="68" y="172" class="cardv">Invoices, orders, customers, products, KPIs, budgets — seeded, reproducible</text>
  <text x="68" y="196" class="cardp">souprise/data/generators/business.py</text>

  <rect x="622" y="128" width="530" height="88" rx="10" fill="#111D33" stroke="#24344E"/>
  <text x="642" y="154" class="cardh">Your own entries</text>
  <text x="642" y="172" class="cardv">Any record with id, text, and optional metadata — ERP and CRM exports</text>
  <text x="642" y="196" class="cardp">rag.index_from_entries([...])</text>

  <!-- Arrows band 1 -> band 2 -->
  <path d="M 313 216 L 313 252" fill="none" stroke="#5CA8FF" stroke-width="1.4" stroke-opacity="0.7" marker-end="url(#arrow)"/>
  <path d="M 887 216 L 887 252" fill="none" stroke="#5CA8FF" stroke-width="1.4" stroke-opacity="0.7" marker-end="url(#arrow)"/>

  <!-- BAND 2: RETRIEVAL -->
  <text x="48" y="248" class="band">RETRIEVAL — PLUGGABLE</text>
  <rect x="48" y="260" width="530" height="100" rx="10" fill="#111D33" stroke="#5CA8FF" stroke-opacity="0.55"/>
  <rect x="458" y="272" width="104" height="20" rx="10" fill="#13203A" stroke="#24344E"/>
  <text x="510" y="286" class="badge" text-anchor="middle">BUILT-IN DEFAULT</text>
  <text x="68" y="288" class="cardh">SimpleHDCRetriever</text>
  <text x="68" y="306" class="cardv">10,000-bit hypervectors, XOR + popcount, chunked exact search, O(n) top-k</text>
  <text x="68" y="322" class="cardv">NumPy only — no extra install, runs air-gapped, append with add()</text>
  <text x="68" y="344" class="cardp">souprise/core/hdc.py</text>

  <rect x="622" y="260" width="530" height="100" rx="10" fill="#111D33" stroke="#24344E"/>
  <rect x="1048" y="272" width="84" height="20" rx="10" fill="#13203A" stroke="#24344E"/>
  <text x="1090" y="286" class="badge" text-anchor="middle">OPTIONAL</text>
  <text x="642" y="288" class="cardh">HDCRetriever — JuiceHDC engine</text>
  <text x="642" y="306" class="cardv">CortexEncoder with typed tokens and character n-grams, larger corpora</text>
  <text x="642" y="322" class="cardv">pip install -e ".[juicehdc]" — selected via RAGConfig(retriever="juicehdc")</text>
  <text x="642" y="344" class="cardp">github.com/mkupermann/JuiceHDC</text>

  <!-- Arrows band 2 -> band 3 -->
  <path d="M 313 360 L 313 396 L 560 396" fill="none" stroke="#5CA8FF" stroke-width="1.4" stroke-opacity="0.7"/>
  <path d="M 887 360 L 887 396 L 640 396" fill="none" stroke="#5CA8FF" stroke-width="1.4" stroke-opacity="0.7"/>
  <text x="330" y="390" class="flow">top-k records + scores</text>

  <!-- BAND 3: PIPELINE -->
  <text x="48" y="392" class="band">PIPELINE</text>
  <rect x="48" y="404" width="1104" height="88" rx="10" fill="#13203A" stroke="#5CA8FF" stroke-opacity="0.8"/>
  <text x="68" y="432" class="cardh">SoupriseRAG</text>
  <text x="68" y="450" class="cardv">query() — retrieve, build context prompt, generate, instrument</text>
  <text x="68" y="472" class="cardp">souprise/core/pipeline.py</text>
  <text x="640" y="432" class="cardh">RAGResult</text>
  <text x="640" y="450" class="cardv">answer · retrieval_results · retrieval_latency · generation_latency · total_latency</text>
  <text x="640" y="472" class="cardv">Measure on your hardware — no published numbers to trust blindly</text>

  <!-- Arrows band 3 -> band 4 -->
  <path d="M 313 492 L 313 528" fill="none" stroke="#5CA8FF" stroke-width="1.4" stroke-opacity="0.7" marker-end="url(#arrow)"/>
  <path d="M 887 492 L 887 528" fill="none" stroke="#5CA8FF" stroke-width="1.4" stroke-opacity="0.7" marker-end="url(#arrow)"/>

  <!-- BAND 4: GENERATION -->
  <text x="48" y="524" class="band">GENERATION — PLUGGABLE, AUTO-DETECTED</text>
  <rect x="48" y="536" width="530" height="60" rx="10" fill="#111D33" stroke="#24344E"/>
  <text x="68" y="562" class="cardh">MLXGenerator</text>
  <text x="68" y="580" class="cardv">Apple Silicon (M-series) — selected automatically when MLX is installed</text>

  <rect x="622" y="536" width="530" height="60" rx="10" fill="#111D33" stroke="#24344E"/>
  <text x="642" y="562" class="cardh">TorchGenerator</text>
  <text x="642" y="580" class="cardv">NVIDIA CUDA, AMD ROCm, plain CPU — Linux, Windows, macOS</text>
</svg>
